<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline - STRATA</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f5fa;
        color: #0c1320;
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 26rem;
        background: #fff;
        border: 1px solid rgba(16, 36, 72, 0.1);
        border-radius: 20px;
        padding: 28px;
        text-align: center;
      }
      h1 { font-size: 20px; margin: 0 0 10px; }
      p { color: #6a7586; font-size: 15px; line-height: 1.55; margin: 0 0 8px; }
      .note { margin-top: 16px; font-size: 13px; color: #157347; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>No connection</h1>
      <p>This page has not been loaded on this device yet, so there is no offline copy of it.</p>
      <p>Reopen it once you are back in signal range.</p>
      <div class="note">Inspection work already recorded on this device is saved and will sync automatically.</div>
    </div>
  </body>
</html>
